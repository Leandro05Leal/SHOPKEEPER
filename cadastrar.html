
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto | ShopKeeper</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>ShopKeeper</h1>
    <p>Cadastro de produtos</p>
</header>

<main>
    <h2>Cadastrar novo produto</h2>

    <form id="formCadastro">

        <label>Nome do produto</label>
        <input type="text" name="nome" placeholder="Digite o nome" required>

        <label>Descrição</label>
        <textarea name="descricao" placeholder="Descreva o produto"></textarea>

        <label>Preço</label>
        <input type="number" name="preco" step="0.01" min="0" placeholder="0.00" required>

        <label>Quantidade</label>
        <input type="number" name="quantidade" min="0" placeholder="0" required>

        <button type="submit">Cadastrar produto</button>

        <div id="mensagem"></div>

        <a href="index.html" class="btn btn-voltar">Voltar ao menu</a>

    </form>
</main>

<script>
<p id="mensagem" style="display:none; color: green; font-weight: bold;">
    ✓ Cadastrado com sucesso!
</p>
</script>
<script>
document.querySelector("form").addEventListener("submit", function(event) {
    event.preventDefault();

    const formulario = this;
    const dados = new FormData(formulario);

    fetch("inserir.php", {
        method: "POST",
        body: dados
    })
    .then(resposta => resposta.text())
    .then(resultado => {
        if (resultado.includes("sucesso")) {
            document.getElementById("mensagem").style.display = "block";
            formulario.reset();
        }
    });
});
</script>
</body>
</html>
